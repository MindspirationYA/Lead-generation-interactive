<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Leads | Mindspiration</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{
  --bg:#eeede7; --surface:#f9f8f4; --ink:#4a4436; --muted:#6f6753; --rule:#dbd4c2; --gold:#b8975a; --gold-lt:#f3e3bb; --night:#2f4652; --night-ink:#fbf7ec; --sand:#f3ecda; --rust:#9c3f3a; --err:#9c3f3a; --ok:#3f5c4a;
  --serif:"Archivo Narrow", "Arial Narrow", Arial, sans-serif; --sans:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%} body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.wrap{max-width:760px; margin:0 auto; padding:0 18px}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0}
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 20px; border-radius:24px; border:0; background:var(--gold-lt); color:#2f4652; font-weight:600; font-size:15px; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--rule)}
.btn.sm{min-height:38px; padding:0 14px; font-size:14px}
.btn[disabled]{opacity:.4; cursor:not-allowed}

/* login */
.login{min-height:100vh; min-height:100dvh; background:var(--night); color:var(--night-ink); display:flex; align-items:center}
.login .card{width:100%; max-width:400px; margin:0 auto; padding:0 22px}
.login h1{font-size:40px; font-weight:500; line-height:1.05; margin-bottom:6px}
.login p{color:#c3cccd; margin:0 0 26px; font-weight:300}
.login label{display:block; font-size:13px; color:#c3cccd; margin:0 0 6px}
.login input{width:100%; background:#22363f; border:1px solid #4a5f69; border-radius:12px; color:var(--night-ink); padding:14px 16px; font-size:17px; margin-bottom:16px; outline:none}
.login input:focus{border-color:var(--gold-lt)}
.login .btn{width:100%; min-height:52px}
.login .err{color:#E07A6A; font-size:14px; min-height:20px; margin:10px 0 0}

/* app */
.bar{position:sticky; top:0; z-index:5; background:var(--night); color:var(--night-ink); padding:14px 0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--night)}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px}
.bar h1{font-size:24px; font-weight:500}
.bar small{display:block; font-size:12px; color:#c3cccd; font-family:var(--sans)}
.bar .btn.ghost{color:var(--night-ink); border-color:#3A342B}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:14px 16px}
.stat b{font-family:var(--serif); font-size:34px; font-weight:600; line-height:1; display:block}
.stat span{font-size:13px; color:var(--muted)}
.controls{display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:14px}
@media (min-width:600px){ .controls{grid-template-columns:1.4fr 1fr 1fr auto} }
.controls input,.controls select{width:100%; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:11px 14px; outline:none; min-height:46px}
.controls input:focus,.controls select:focus{border-color:var(--gold)}
.list{display:grid; gap:8px; padding-bottom:40px}
.lead{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:14px 16px; cursor:pointer}
.lead:hover{border-color:var(--gold)}
.lead .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.lead b{font-family:var(--serif); font-size:21px; font-weight:600}
.lead time{font-size:13px; color:var(--muted); white-space:nowrap}
.lead .sub{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted)}
.chip{display:inline-block; background:var(--sand); border-radius:20px; padding:2px 10px; font-size:12px; color:var(--ink)}
.chip.gold{background:var(--ok); color:#fff}
.chip.new{background:var(--rust); color:#fff}
.empty{text-align:center; color:var(--muted); padding:50px 0}

/* detail */
.sheet{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none}
.sheet.on{display:block}
.panel{position:absolute; right:0; top:0; bottom:0; width:100%; max-width:560px; background:var(--bg); overflow:auto; padding:0 0 40px}
.panel .head{position:sticky; top:0; background:var(--night); color:var(--night-ink); padding:16px 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.panel .head h2{font-size:30px; font-weight:500; line-height:1.05}
.panel .head p{margin:4px 0 0; color:#c3cccd; font-size:14px}
.panel .x{background:none; border:0; color:var(--night-ink); font-size:28px; line-height:1; cursor:pointer; padding:0 4px}
.panel section{padding:20px 20px 0}
.panel h3{font-size:22px; margin-bottom:10px}
.kv{display:grid; grid-template-columns:120px 1fr; gap:6px 12px; font-size:15px}
.kv span{color:var(--muted)}
.kv a{color:var(--ink)}
.acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.meter{margin-bottom:12px}
.meter .row{display:flex; justify-content:space-between; font-size:15px; margin-bottom:4px}
.meter .row b{font-family:var(--serif); font-size:18px}
.track{height:8px; background:var(--sand); border-radius:5px; overflow:hidden}
.track i{display:block; height:100%; background:var(--gold); border-radius:5px}
.track.low i{background:var(--rust)}
.ans{border-top:1px solid var(--rule); padding:12px 0}
.ans:last-child{border-bottom:1px solid var(--rule)}
.ans .q{font-size:14px; color:var(--muted); margin:0 0 3px}
.ans .q em{font-style:normal; color:var(--gold); font-weight:500}
.ans .a{font-family:var(--serif); font-size:19px; margin:0}
.ans .a small{font-family:var(--sans); font-size:14px; color:var(--muted)}
.todo{list-style:none; padding:0; margin:0}
.todo li{padding:8px 0; border-top:1px solid var(--rule); font-size:15px}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--rust);align-self:center}
.sys{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px; color:var(--muted); margin:0 0 4px}
.sys span{margin-right:4px}
.sys-note{font-size:12px; color:var(--muted); margin:0 0 14px}
.los{border:1px solid var(--rule); border-radius:12px; padding:14px 16px; margin:0 0 16px}
.los h2{font-size:22px; margin:0 0 4px}
.los p{margin:4px 0}
.los .gew{margin:10px 0; padding-left:20px}
.los .gew li{margin:6px 0}
.los .gew .btn{margin-left:6px}
</style>
</head>
<body>
<main id="app"></main>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="/config.js"></script>
<script>
const ICA = window.ICA || {}; const AS = ICA.assessments || {};
/* readable names for score keys and extra fields */
const dimLabel = k => { for (const a of Object.values(AS)) if (a.dimensions && a.dimensions[k]) return a.dimensions[k].label; return k; };
const EXTRA = { teilnahme_at:"Teilnahme am", consent:"Einwilligung", consent_text:"Einwilligungstext", consent_at:"Eingewilligt am", kontakt:"Kontakt erlaubt", kontakt_text:"Einwilligungstext", kontakt_at:"Kontakt erlaubt am", zugang_at:"Angemeldet am" };
const isCal = l => l.assessment_id === "adventskalender";
const isLos = l => l.assessment_id === "verlosung";
const isQuiz = l => !isCal(l) && !isLos(l);
/* ---------- Verlosung Klarheits-Call ----------
   Teilnahme bis 26.12.2026, 23:59 Uhr deutscher Zeit (= 22:59:59 UTC). Ziehung ab 27.12.
   KLARHEIT_LINK: Link zur Google-Kalender-Buchungsseite „Klarheits-Call“ HIER EINTRAGEN, sobald er angelegt ist. */
const LOS_SCHLUSS = "2026-12-26T22:59:59.999Z";
const LOS_START = "2026-12-23T23:00:00.000Z";   /* 24.12.2026, 0 Uhr deutscher Zeit: frühere Einträge sind Tests und zählen nicht */
const KLARHEIT_LINK = "https://calendar.google.com/calendar/appointments/schedules/AcZssZ1HVXoO6KH3YlWdXwazow2OzwMR6DZAFqvMJOWrDVbxZQRkj7qc6ILvHEm8ZyKL-Kp8v7et-9J8";
const LOS_KEY = () => `ica-admin-verlosung-${(session && session.coach) || "site"}`;
function losTeilnehmerinnen(){
  const byMail = new Map();
  [...data.leads].filter(l => isLos(l) && l.email && l.created_at >= LOS_START && l.created_at <= LOS_SCHLUSS)
    .sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)))
    .forEach(l => { const k = l.email.trim().toLowerCase(); if (!byMail.has(k)) byMail.set(k, l); });
  return [...byMail.values()];
}
function gewinnMail(l){
  const link = KLARHEIT_LINK || "[Link zum Klarheits-Call folgt]";
  return { subject: "Du hast gewonnen: dein Klarheits-Call mit mir 🤍",
    body: `Hey meine Liebe,\n\nich habe heute die Gewinnerinnen gezogen und du bist dabei! Herzlichen Glückwunsch, ich freue mich so auf unser Gespräch.\n\nIn deinem Klarheits-Call nehmen wir uns 45 Minuten nur für dich. Wir schauen gemeinsam, wo du gerade stehst, was dich noch zurückhält und was dein erster Schritt ins neue Jahr ist.\n\nBuch dir hier deinen Termin für den Januar. Die Buchungsseite heißt „Dein Call mit Yassi“:\n${link}\n\nDu musst dafür nichts vorbereiten. Komm einfach so, wie du bist.\n\nFühl dich gedrückt,\nYassi von Mindspiration` };
}
const mailtoGewinn = l => { const m = gewinnMail(l); return `mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`; };
function losZiehen(n){
  const t = losTeilnehmerinnen(), pool = t.slice(), gew = [];
  while (gew.length < n && pool.length){ const r = new Uint32Array(1); crypto.getRandomValues(r); gew.push(pool.splice(r[0] % pool.length, 1)[0]); }
  return gew.map(l => l.id);
}
function renderLos(){
  const box = document.getElementById("los"); if (!box) return;
  const t = losTeilnehmerinnen();
  if (!t.length && !data.leads.some(isLos)){ box.hidden = true; return; }
  box.hidden = false;
  let gezogen = []; try { gezogen = JSON.parse(localStorage.getItem(LOS_KEY()) || "[]"); } catch(e){}
  const gew = gezogen.map(id => data.leads.find(l => l.id === id)).filter(Boolean);
  const vorbei = new Date().toISOString() > LOS_SCHLUSS;
  box.innerHTML = `<h2>Verlosung Klarheits-Call</h2>
    <p>${t.length} ${t.length === 1 ? "Teilnehmerin" : "Teilnehmerinnen"} bis 26.12., 23:59 Uhr. ${vorbei ? "Die Teilnahme ist beendet." : "Die Teilnahme läuft noch."}</p>
    ${gew.length ? `<ol class="gew">${gew.map(l => `<li><b>${esc(l.name)}</b> · ${esc(l.email)} <a class="btn sm" href="${mailtoGewinn(l)}">Gewinn-Mail schreiben</a></li>`).join("")}</ol>` : ""}
    ${!KLARHEIT_LINK && gew.length ? `<p class="hint">Der Calendly-Link zum Klarheits-Call fehlt noch. In der Mail steht dann „[Link zum Klarheits-Call folgt]“.</p>` : ""}
    <div class="acts">${gew.length ? `<button class="btn ghost sm" id="losNeu">Neu ziehen</button>` : `<button class="btn sm" id="losZieh" ${t.length ? "" : "disabled"}>5 Gewinnerinnen ziehen</button>`}</div>
    ${!vorbei && !gew.length && t.length ? `<p class="sys-note">Zieh am besten erst am 27.12., damit alle Teilnahmen dabei sind.</p>` : ""}`;
  const z = document.getElementById("losZieh");
  if (z) z.onclick = () => { const ids = losZiehen(5); try { localStorage.setItem(LOS_KEY(), JSON.stringify(ids)); } catch(e){} renderLos(); toast(`${ids.length} ${ids.length === 1 ? "Gewinnerin" : "Gewinnerinnen"} gezogen`); };
  const nb = document.getElementById("losNeu");
  if (nb) nb.onclick = () => { if (nb.dataset.sicher !== "1"){ nb.dataset.sicher = "1"; nb.textContent = "Wirklich neu ziehen? Nochmal tippen"; return; } try { localStorage.removeItem(LOS_KEY()); } catch(e){} renderLos(); };
}
const kontaktChip = l => (l.lead_extra && l.lead_extra.kontakt === "ja") ? `<span class="chip gold">Kontakt erlaubt</span>` : `<span class="chip">Kein Kontakt</span>`;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SESSION = "ica-admin-session";
let session = null, data = { coach:null, leads:[] }, view = { q:"", assessment:"", pattern:"" };
try { session = JSON.parse(sessionStorage.getItem(SESSION) || "null"); } catch(e){}
const seenKey = () => `ica-admin-seen-${(session && session.coach) || "site"}`;
const lastSeen = () => { try { return localStorage.getItem(seenKey()) || ""; } catch(e){ return ""; } };

function renderLogin(msg){
  app.innerHTML = `
  <div class="login"><form class="card" id="login">
    <h1>Leads</h1><p>Gib deine PIN ein, um deine Leads aus Check-in und Adventskalender zu sehen.</p>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn" type="submit" id="go">Anmelden</button>
    <p class="err" id="err">${esc(msg||"")}</p>
  </form></div>`;
  document.getElementById("login").onsubmit = async e => {
    e.preventDefault();
    const pin = document.getElementById("pin").value.trim();
    const b = document.getElementById("go"); b.disabled = true; b.textContent = "Wird geprüft";
    const r = await api({ pin });
    if (!r.ok){ b.disabled = false; b.textContent = "Anmelden"; document.getElementById("err").textContent = r.error; return; }
    session = { pin, coach: r.coach.slug }; sessionStorage.setItem(SESSION, JSON.stringify(session));
    data = r; renderApp();
  };
}

async function api(body){
  try {
    const r = await fetch("/.netlify/functions/leads", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return { ok:false, error: j.error || `Anfrage fehlgeschlagen (${r.status})` };
    return Object.assign({ ok:true }, j);
  } catch(e){ return { ok:false, error:"Der Server ist gerade nicht erreichbar. Prüf deine Verbindung und versuch es noch einmal." }; }
}

const fmt = iso => { const d = new Date(iso); return d.toLocaleDateString("de-DE", { day:"numeric", month:"short" }) + " " + d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" }); };
const wa = n => "https://wa.me/" + String(n||"").replace(/\D/g, "");
const filtered = () => data.leads.filter(l =>
  (!view.assessment || l.assessment_id === view.assessment) &&
  (!view.pattern || l.pattern_label === view.pattern) &&
  (!view.q || [l.name,l.whatsapp,l.email,l.instagram,l.pattern_label].join(" ").toLowerCase().includes(view.q.toLowerCase())));

function renderApp(){
  const seen = lastSeen();
  const week = Date.now() - 7*864e5;
  const newCount = data.leads.filter(l => l.created_at > seen).length;
  const assessments = [...new Set(data.leads.map(l => l.assessment_title || l.assessment_id))];
  const patterns = [...new Set(data.leads.map(l => l.pattern_label).filter(Boolean))].sort();
  app.innerHTML = `
  <div class="bar"><div class="wrap">
    <div><h1>${esc(data.coach.name)}</h1><small>Check-in und Adventskalender</small></div>
    <div style="display:flex;gap:8px"><button class="btn ghost sm" id="refresh">Aktualisieren</button><button class="btn ghost sm" id="out">Abmelden</button></div>
  </div></div>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><b>${data.leads.length}</b><span>Leads gesamt</span></div>
      <div class="stat"><b>${data.leads.filter(l => new Date(l.created_at).getTime() > week).length}</b><span>Letzte 7 Tage</span></div>
      <div class="stat"><b>${newCount}</b><span>Neu seit letztem Besuch</span></div>
    </div>
    <div class="controls">
      <input id="q" placeholder="Name, Nummer oder E-Mail suchen" value="${esc(view.q)}">
      <select id="fa"><option value="">Alle Quellen</option>${assessments.map(a => { const id = (data.leads.find(l => (l.assessment_title||l.assessment_id)===a)||{}).assessment_id; return `<option value="${esc(id)}" ${view.assessment===id?"selected":""}>${esc(a)}</option>`; }).join("")}</select>
      <select id="fp"><option value="">Alle Muster</option>${patterns.map(p => `<option ${view.pattern===p?"selected":""}>${esc(p)}</option>`).join("")}</select>
      <button class="btn ghost" id="csv">CSV exportieren</button>
    </div>
    <div class="sys"><span>Für systeme.io exportieren:</span>${Object.entries(SYS_RANGES).map(([k,v]) => `<button class="btn ghost sm" data-sys="${k}">${v}</button>`).join("")}</div>
    <p class="sys-note">Alle Kontakte mit E-Mail-Adresse. Die Spalte „Kontakt erlaubt“ zeigt dir, wer zugestimmt hat. Deine Filter oben gelten auch hier.</p>
    <div class="los" id="los" hidden></div>
    <div class="list" id="list"></div>
  </div>`;
  renderList(seen);
  renderLos();
  document.getElementById("q").oninput = e => { view.q = e.target.value; renderList(seen); };
  document.getElementById("fa").onchange = e => { view.assessment = e.target.value; renderList(seen); };
  document.getElementById("fp").onchange = e => { view.pattern = e.target.value; renderList(seen); };
  document.getElementById("csv").onclick = exportCsv;
  document.querySelectorAll("[data-sys]").forEach(b => b.onclick = () => exportSys(b.dataset.sys));
  document.getElementById("out").onclick = () => { sessionStorage.removeItem(SESSION); session = null; renderLogin(); };
  document.getElementById("refresh").onclick = async () => { const r = await api(session); if (r.ok){ data = r; renderApp(); toast("Aktualisiert"); } else toast(r.error); };
  // mark everything as seen once the list has rendered
  if (data.leads.length) try { localStorage.setItem(seenKey(), data.leads[0].created_at); } catch(e){}
}

function renderList(seen){
  const rows = filtered();
  const el = document.getElementById("list");
  if (!rows.length){ el.innerHTML = `<p class="empty">${data.leads.length ? "Keine Leads für diesen Filter." : "Noch keine Leads. Teile den Link zum Check-in oder zum Adventskalender, dann erscheinen sie hier."}</p>`; return; }
  el.innerHTML = rows.map(l => `
    <button class="lead" data-id="${l.id}">
      <div class="top"><b>${esc(l.name)}</b><time>${fmt(l.created_at)}</time></div>
      <div class="sub">
        ${l.created_at > seen ? `<span class="chip new">Neu</span>` : ""}
        ${isCal(l) ? kontaktChip(l) : isLos(l) ? `<span class="chip gold">Verlosung</span>` : `<span class="chip gold">${esc(l.pattern_label||l.pattern)}</span>`}
        <span class="chip">${esc(l.assessment_title||l.assessment_id)}</span>
        ${typeof l.overall === "number" ? `<span>Gesamt ${l.overall}</span>` : ""}
        ${l.lowest ? `<span>Mehr Aufmerksamkeit: ${esc(dimLabel(l.lowest))}</span>` : ""}
        ${l.lead_extra && l.lead_extra.revenue ? `<span>${esc(l.lead_extra.revenue)}</span>` : ""}
      </div>
    </button>`).join("");
  el.querySelectorAll(".lead").forEach(b => b.onclick = () => openLead(b.dataset.id));
}

function openLead(id){
  const l = data.leads.find(x => x.id === id); if (!l) return;
  const scores = Object.entries(l.scores||{});
  const answers = (l.answers||[]).map(a => {
    let v = a.answer;
    if (v && typeof v === "object") v = Object.entries(v).map(([k,n]) => `${k} <small>${n}</small>`).join(" \u00b7 ");
    else if (typeof v === "number") v = `${v}`;
    else v = esc(v ?? "");
    return `<div class="ans"><p class="q"><em>${a.n}</em> ${esc(a.question)}</p><p class="a">${v}</p></div>`;
  }).join("");
  document.getElementById("panel").innerHTML = `
    <div class="head"><div><h2>${esc(l.name)}</h2><p>${[l.pattern_label||l.pattern, l.assessment_title||l.assessment_id, fmt(l.created_at)].filter(Boolean).map(esc).join(" \u00b7 ")}</p></div><button class="x" id="close" aria-label="Schließen">\u00d7</button></div>
    <section>
      <div class="kv">
        ${l.email ? `<span>E-Mail</span><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ""}
        ${l.whatsapp ? `<span>WhatsApp</span><a href="${wa(l.whatsapp)}" target="_blank" rel="noopener">${esc(l.whatsapp)}</a>` : ""}
        ${l.instagram ? `<span>Instagram</span><a href="https://instagram.com/${esc(l.instagram)}" target="_blank" rel="noopener">@${esc(l.instagram)}</a>` : ""}
        ${Object.entries(l.lead_extra||{}).filter(([k,v]) => k !== "consent_text" && k !== "kontakt_text" && v !== "").map(([k,v]) => `<span>${esc(EXTRA[k] || k.replace(/_/g," "))}</span><span>${esc(/_at$/.test(k) ? fmt(v) : v)}</span>`).join("")}
        ${l.branch ? `<span>Pfad</span><span>${esc(l.branch)}</span>` : ""}
        ${typeof l.overall === "number" ? `<span>Gesamt</span><span>${l.overall}/100</span>` : ""}
        ${l.meta && l.meta.ref ? `<span>Kam von</span><span>${esc(l.meta.ref)}</span>` : ""}
      </div>
      <div class="acts">
        ${l.email && isCal(l) ? (l.lead_extra && l.lead_extra.kontakt === "ja" ? `<a class="btn sm" href="mailto:${esc(l.email)}?subject=${encodeURIComponent("Dein Adventskalender")}&body=${encodeURIComponent(`Hallo ${l.name},\n\nschön, dass du beim Adventskalender dabei bist. \n\nLiebe Grüße`)}">E-Mail schreiben</a>` : `<span class="hint">Keine Kontakt-Einwilligung. Bitte nicht per E-Mail anschreiben.</span>`) : ""}
        ${l.email && isLos(l) ? `<a class="btn sm" href="${mailtoGewinn(l)}">Gewinn-Mail schreiben</a>` : ""}
        ${l.email && isQuiz(l) ? (() => { const m = followUpMail(l); return `<a class="btn sm" href="mailto:${esc(l.email)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}">E-Mail schreiben</a><button class="btn ghost sm" id="copymail">Mail-Text kopieren</button>`; })() : ""}
        ${l.whatsapp ? `<a class="btn ${l.email?"ghost ":""}sm" href="${wa(l.whatsapp)}?text=${encodeURIComponent(`Hallo ${l.name}, danke, dass du den Check-in gemacht hast. Dein Ergebnis war ${l.pattern_label||""}. Wie geht es dir damit?`)}" target="_blank" rel="noopener">WhatsApp schreiben</a>` : ""}
        <button class="btn ghost sm" id="copylead">Zusammenfassung kopieren</button>
        ${l.email ? `<button class="btn ghost sm" id="syslead">Für systeme.io exportieren</button>` : ""}
      </div>
    </section>
    ${scores.length ? `<section><h3>Bereiche</h3>${scores.map(([k,v]) => `<div class="meter"><div class="row"><b>${esc(dimLabel(k))}</b><span>${v}/100</span></div><div class="track ${v<40?"low":""}"><i style="width:${Math.max(v,3)}%"></i></div></div>`).join("")}</section>` : ""}
    ${(l.actions||[]).length ? `<section><h3>Ihre drei Schritte für die Woche</h3><ol class="todo">${l.actions.map(a => `<li>${esc(a)}</li>`).join("")}</ol></section>` : ""}
    ${(l.answers||[]).length ? `<section><h3>Alle Antworten</h3>${answers}</section>` : ""}`;
  const sheet = document.getElementById("sheet"); sheet.classList.add("on");
  document.getElementById("close").onclick = () => sheet.classList.remove("on");
  sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove("on"); };
  const sl = document.getElementById("syslead");
  if (sl) sl.onclick = () => {
    const { rows } = sysRows([l]);
    const nm = String(l.name || "kontakt").trim().toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").replace(/^-+|-+$/g, "");
    download(sysCsv(rows), `${data.coach.slug}-systeme-io-${nm || "kontakt"}-${new Date().toISOString().slice(0,10)}.csv`, false);
    toast("1 Kontakt exportiert");
  };
  const cm = document.getElementById("copymail");
  if (cm) cm.onclick = async () => {
    const m = followUpMail(l);
    try { await navigator.clipboard.writeText(`Betreff: ${m.subject}\n\n${m.body}`); toast("Mail-Text kopiert"); } catch(e){ toast("Kopieren ist hier nicht möglich"); }
  };
  document.getElementById("copylead").onclick = async () => {
    const t = `${l.name}${l.email?" \u00b7 "+l.email:""}${l.whatsapp?" \u00b7 "+l.whatsapp:""}${l.instagram?" \u00b7 @"+l.instagram:""}\n${l.assessment_title||l.assessment_id}: ${l.pattern_label||l.pattern}\n` +
      scores.map(([k,v]) => `${dimLabel(k)} ${v}/100`).join(", ") + `\nMehr Aufmerksamkeit: ${dimLabel(l.lowest||"")}\n${fmt(l.created_at)}`;
    try { await navigator.clipboard.writeText(t); toast("Kopiert"); } catch(e){ toast("Kopieren ist hier nicht möglich"); }
  };
}

/* Warm follow-up email for a Check-in lead, built from ICA.followUp in config.js.
   Falls back to a short neutral text if config.js has no followUp block yet. */
function followUpMail(l){
  const F = ICA.followUp;
  const first = String(l.name || "").trim().split(/\s+/)[0] || "";
  if (!F) return { subject: "Dein Ergebnis: " + (l.pattern_label || ""), body: `Hallo ${first},\n\ndanke, dass du dir die Zeit für den Check-in genommen hast. Dein Ergebnis war ${l.pattern_label || ""}. Ich würde gern kurz hören, wie es dir damit geht.\n\nLiebe Grüße` };
  let link = F.callUrl || "";
  try { const u = new URL(link); u.searchParams.set("utm_source", "check-in"); u.searchParams.set("utm_medium", "email"); u.searchParams.set("utm_content", String(l.pattern_label || l.pattern || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/\s+/g, "-")); link = u.toString(); } catch(e){}
  const sc = l.scores || {}, low = l.lowest, lowV = sc[low], from = F.strongFrom ?? 70;
  const best = Object.entries(sc).filter(([k,v]) => typeof v === "number" && k !== low && v >= from).sort((a,b) => b[1] - a[1])[0];
  const vars = { name: first, pattern: l.pattern_label || "", low: low ? dimLabel(low) : "", strong: best ? dimLabel(best[0]) : "", link };
  const fill = t => String(t || "").replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
  const allStrong = typeof lowV === "number" && lowV >= from;
  /* order: greeting, her pattern, her weakest area, her strongest area, Yassi's story,
     the change for her pattern, 1:1 offer, Wegweiser-Call, closing, signature */
  const blocks = [
    F.greeting, F.thanks,
    (F.patterns || {})[l.pattern],
    low ? (allStrong ? F.allStrong : (F.areas || {})[low]) : "",
    (!allStrong && best) ? F.strong : "",
    F.story, (F.goals || {})[l.pattern],
    F.offer, link ? F.call : "", F.closing, F.signature
  ];
  return { subject: fill((F.subjects || {})[l.pattern] || F.subject), body: blocks.map(fill).filter(t => t && t.trim()).join("\n\n") };
}

function exportCsv(){
  const rows = filtered(); if (!rows.length) return toast("Nichts zu exportieren");
  const dims = [...new Set(rows.flatMap(l => Object.keys(l.scores||{})))];
  const maxQ = Math.max(...rows.map(l => (l.answers||[]).length));
  const extras = [...new Set(rows.flatMap(l => Object.keys(l.lead_extra||{})))];
  const head = ["Datum","Check-in","Name","WhatsApp","E-Mail","Instagram",...extras.map(k => EXTRA[k] || k),"Pfad","Muster","Gesamt","Mehr Aufmerksamkeit",...dims.map(dimLabel), ...Array.from({length:maxQ},(_,i)=>`q${i+1}`)];
  const cell = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [head.map(cell).join(",")].concat(rows.map(l => {
    const ans = (l.answers||[]).map(a => a.answer && typeof a.answer === "object" ? Object.entries(a.answer).map(([k,n])=>`${k}=${n}`).join("; ") : a.answer);
    return [l.created_at, l.assessment_title||l.assessment_id, l.name, l.whatsapp, l.email, l.instagram, ...extras.map(k => (l.lead_extra||{})[k] ?? ""), l.branch, isCal(l) ? "Adventskalender" : (l.pattern_label||l.pattern), l.overall, dimLabel(l.lowest||""), ...dims.map(d => (l.scores||{})[d] ?? ""), ...ans].map(cell).join(",");
  }));
  download(lines.join("\n"), `${data.coach.slug}-leads-${new Date().toISOString().slice(0,10)}.csv`, true);
}
/* bom:true for Excel (umlauts show correctly), false for systeme.io (plain UTF-8, as its help pages ask) */
function download(text, name, bom){
  const blob = new Blob([(bom ? "\ufeff" : "") + text], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- systeme.io export ----------
   systeme.io imports CSV only (UTF-8, comma, email required).
   Every lead with an email goes in (Yassi's decision, 20.11.2026). The column
   "Kontakt erlaubt" says ja/nein: Check-in = consent box ticked,
   Adventskalender = "Kontakt erlaubt" ticked. "ja" wins if she agreed anywhere.
   One row per email address: a woman who did both is merged, newest data first. */
const SYS_RANGES = { heute:"Heute", woche:"Letzte 7 Tage", monat:"Letzte 30 Tage" };
const hasConsent = l => isCal(l) ? !!(l.lead_extra && l.lead_extra.kontakt === "ja") : !!(l.lead_extra && l.lead_extra.consent === "ja");
function sinceFor(range){
  if (range === "heute"){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  return Date.now() - (range === "woche" ? 7 : 30) * 864e5;
}
function sysRows(leads){
  const byMail = new Map(); let skipped = 0;
  [...leads].sort((a,b) => String(b.created_at).localeCompare(String(a.created_at))).forEach(l => {
    if (!l.email) { skipped++; return; }
    const key = l.email.trim().toLowerCase(), src = isCal(l) ? "Adventskalender" : isLos(l) ? "Verlosung" : "Check-in", ex = byMail.get(key);
    if (ex){
      if (!ex.sources.includes(src)) ex.sources.push(src);
      if (!ex.quiz && isQuiz(l)) ex.quiz = l;
      if (!ex.phone && l.whatsapp) ex.phone = l.whatsapp;
      if (hasConsent(l)) ex.ok = true;
      return;
    }
    byMail.set(key, { lead:l, email:key, sources:[src], quiz: isQuiz(l) ? l : null, phone: l.whatsapp || "", ok: hasConsent(l) });
  });
  return { rows:[...byMail.values()], skipped };
}
function sysPhone(p){
  const raw = String(p || "").trim(); if (!raw) return "";
  const digits = raw.replace(/\D/g, "");
  return raw.startsWith("+") ? "+" + digits : raw.startsWith("00") ? "+" + digits.slice(2) : digits;
}
function sysCsv(rows){
  const head = ["Email","First name","Phone number","Quelle","Muster","Mehr Aufmerksamkeit","Selbstwert","Grenzen","Energie","Richtung","Kontakt erlaubt","Eingetragen am"];
  const cell = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [head.map(cell).join(",")].concat(rows.map(r => {
    const q = r.quiz || {}, sc = q.scores || {};
    return [r.email, String(r.lead.name || "").trim(), sysPhone(r.phone), r.sources.join(" + "), q.pattern_label || "", q.lowest ? dimLabel(q.lowest) : "",
      sc.selbstwert ?? "", sc.grenzen ?? "", sc.energie ?? "", sc.richtung ?? "", r.ok ? "ja" : "nein", String(r.lead.created_at || "").slice(0,10)].map(cell).join(",");
  }));
  return lines.join("\r\n") + "\r\n";
}
function exportSys(range){
  const since = sinceFor(range);
  const inRange = filtered().filter(l => new Date(l.created_at).getTime() >= since);
  if (!inRange.length) return toast(`Keine Leads: ${SYS_RANGES[range]}`);
  const { rows, skipped } = sysRows(inRange);
  const left = skipped ? `, ${skipped} ohne E-Mail-Adresse ausgelassen` : "";
  if (!rows.length) return toast(`Keine Kontakte mit E-Mail-Adresse${left}`, 3500);
  download(sysCsv(rows), `${data.coach.slug}-systeme-io-${range}-${new Date().toISOString().slice(0,10)}.csv`, false);
  toast(`${rows.length} ${rows.length === 1 ? "Kontakt" : "Kontakte"} exportiert${left}`, 3500);
}
function toast(m, ms){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), ms || 1800); }

(async () => {
  if (session){ const r = await api(session); if (r.ok){ data = r; return renderApp(); } session = null; sessionStorage.removeItem(SESSION); }
  renderLogin();
})();
