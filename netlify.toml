[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # COACH_SLUG appears in config.js on purpose; tell the secrets scanner not to fail the build over it
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_PIN,COACH_SLUG"

# Clean links: / and /check-in both load index.html, which reads the assessment name from the address.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
# Adventskalender lives in its own folder on the same site, sharing the leads store and /admin
[[redirects]]
  from = "/adventskalender"
  to = "/adventskalender/"
  status = 301
[[redirects]]
  from = "/adventskalender/*"
  to = "/adventskalender/index.html"
  status = 200
# Later, own subdomain: add kalender.mindspiration.co as a domain alias in Netlify, then remove the # from the next 5 lines
# [[redirects]]
#   from = "https://kalender.mindspiration.co/*"
#   to = "/adventskalender/:splat"
#   status = 200
#   force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/adventskalender/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
